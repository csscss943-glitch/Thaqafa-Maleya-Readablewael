استقرار الاسعار، يدير الاحتياطي."},{q:"تدرب: كيف تعمل البنوك التجارية؟",a:"تجمع الودائع بفائدة منخفضة وتقرضها بفائدة اعلى، وتقدم حسابات وبطاقات وتحويلات."}]},{id:7,title:"الفصل 7: الادخار",questions:[{q:"تدرب: ما هو الادخار؟",a:"اقتطاع جزء من الدخل الحالي بالجنيه وعدم انفاقه للطوارئ او هدف مستقبلي."}]},{id:8,title:"الفصل 8: انواع الادخار 50/30/20",questions:[{q:"تدرب: اشرح قاعدة 50/30/20",a:"50% احتياجات اساسية، 30% رغبات، 20% ادخار وديون واستثمار بالجنيه المصري."},{q:"تدرب: دخلك 10000 جنيه كم تخصص؟",a:"5000 اساسيات، 3000 رغبات، 2000 ادخار."}]},{id:9,title:"الفصل 9: الاستثمار الاساسيات",questions:[{q:"تدرب: ما هو الاستثمار؟",a:"توظيف المال المدخر في اصل يتوقع ان ينمو ويحقق عائدا مع مخاطرة. الادخار يحفظ، الاستثمار ينمي."}]},{id:10,title:"الفصل 10: الادخار مقابل الاستثمار",questions:[{q:"تدرب: ما الفرق بين الادخار والاستثمار؟",a:"الادخار امن وسائل وعائده قليل. الاستثمار عائده اعلى لكن غير مضمون."},{q:"تدرب: ما العلاقة بين العائد والمخاطرة؟",a:"طردية: كلما زاد العائد المتوقع زادت المخاطرة."},{q:"تدرب: ما الفرق بين السهم والسند؟",a:"السهم ملكية، السند دين بفائدة ثابتة بالجنيه."}]},{id:11,title:"الفصل 11: التضخم التعريف والاسباب",questions:[{q:"تدرب: ما هو التضخم؟",a:"الارتفاع العام والمستمر للاسعار، يقلل القوة الشرائية للجنيه."},{q:"تدرب: ما اسباب التضخم؟",a:"تضخم الطلب، تضخم التكاليف، زيادة كمية النقود دون انتاج."}]},{id:12,title:"الفصل 12: القوة الشرائية",questions:[{q:"تدرب: كيف يؤثر التضخم على الميزانية؟",a:"نفس المرتب يشتري سلعا اقل، يضطر لتقليل الكميات او زيادة الدخل."}]},{id:13,title:"الفصل 13: الميزانية الشخصية",questions:[{q:"تدرب: ما هي الميزانية؟",a:"خطة تقديرية للدخل والمصروف خلال شهر: حساب الدخل، تسجيل المصاريف، المقارنة، التعديل."}]},{id:14,title:"الفصل 14: ميزانية الدولة",questions:[{q:"تدرب: ما هي ميزانية الدولة؟",a:"وثيقة تقدر ايرادات الدولة ونفقاتها سنويا، تصدر بقانون ربط الموازنة."},{q:"تدرب: ما هو عجز الميزانية؟",a:"عندما تكون النفقات اكبر من الايرادات، يعالج بترشيد الانفاق وتحسين التحصيل والاقتراض."}]},{id:15,title:"الفصل 15: الديون",questions:[{q:"
